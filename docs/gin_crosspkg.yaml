openapi: 3.1.0
info:
    title: Cross-package DTO API (gin)
    version: 1.0.0
paths:
    /api/v1/users:
        get:
            operationId: userListUsers
            summary: List users
            tags:
                - users
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/UserResponse'
        post:
            operationId: userCreateUser
            summary: Create user
            tags:
                - users
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserResponse'
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                "409":
                    description: Conflict
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
components:
    schemas:
        CreateUserRequest:
            type: object
            properties:
                email:
                    type: string
                    format: email
                    example: larry@example.com
                username:
                    type: string
                    example: larry_somik
                    minLength: 3
                    maxLength: 32
            required:
                - username
                - email
        ErrorResponse:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable error message
            required:
                - error
        UserResponse:
            type: object
            properties:
                id:
                    type: integer
                    format: int64
                username:
                    type: string
